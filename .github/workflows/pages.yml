name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One site at a time; a new push replaces a run still in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with the wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build state
        uses: Swatinem/rust-cache@v2

      - name: Build the wasm binary
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Assemble the site
        run: |
          mkdir dist
          cp target/wasm32-unknown-unknown/release/autofield.wasm dist/autofield.wasm
          cp web/index.html dist/index.html
          cp web/mq_js_bundle.js dist/mq_js_bundle.js

      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
